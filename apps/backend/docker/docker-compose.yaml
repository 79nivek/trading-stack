services:

  trader-bot:
    image: trader-bot:latest
    container_name: trader-bot
    # restart: always
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
