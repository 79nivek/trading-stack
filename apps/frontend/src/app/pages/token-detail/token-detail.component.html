<div class="h-full w-full flex flex-col p-4 gap-4">
  <ng-template #HeaderSection>
    <div
      class="flex items-center gap-4 bg-surface p-4 rounded-lg shadow-sm border border-border shrink-0"
    >
      <a
        routerLink="/"
        class="p-2 hover:bg-black/5 dark:hover:bg-white/5 rounded-full transition-colors cursor-pointer text-text-muted hover:text-text"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          class="w-6 h-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"
          />
        </svg>
      </a>
      <h1 class="text-2xl font-bold text-text mb-0">{{ symbol }}</h1>
    </div>
  </ng-template>

  <div
    class="flex-1 bg-surface rounded-lg shadow-sm border border-border relative overflow-hidden"
  >
    @if (symbol) {
      <app-chart
        [symbol]="symbol"
        class="absolute inset-0 block w-full h-full"
      ></app-chart>
    }
  </div>
</div>
