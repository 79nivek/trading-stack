<div class="followed-container w-full mx-auto">
  <!-- ===== Header section (injected into layout header) ===== -->
  <ng-template #HeaderSection>
    <div class="flex items-center gap-3">
      <app-auto-complete
        [data]="allBinanceSymbols()"
        [isLoading]="exchangeInfo.isLoading()"
        (itemSelected)="onSymbolSelected($event)"
        placeholderKey="FOLLOWED.SEARCH_PLACEHOLDER"
      ></app-auto-complete>
      <!-- Refresh button -->
      <button
        (click)="followedQuery.refetch()"
        [disabled]="followedQuery.isFetching()"
        class="flex items-center gap-2 px-4 py-1.5 bg-primary/10 text-primary border border-primary/20 rounded-md hover:bg-primary/20 transition-colors disabled:opacity-50 disabled:cursor-not-allowed font-medium text-sm"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          [class.animate-spin]="followedQuery.isFetching()"
        >
          <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path>
          <path d="M21 3v5h-5"></path>
        </svg>
        <span translate="SUGGESTION.REFRESH">Refresh</span>
      </button>
    </div>
  </ng-template>

  <!-- ===== Empty state ===== -->
  <app-no-data
    [showNoData]="
      !followedQuery.isPending() && (followedQuery.data()?.length ?? 0) === 0
    "
  />

  <!-- ===== Cards grid with drag-and-drop ===== -->
  @if (followedQuery.data(); as items) {
    <div class="cards-grid">
      @for (entry of items; track entry.id; let i = $index) {
        <div
          class="followed-card-wrapper"
          [attr.draggable]="dragEnabledIndex() === i ? 'true' : 'false'"
          [class.drag-over]="isDragOver(i)"
          (dragstart)="onDragStart($event, i)"
          (dragover)="onDragOver($event, i)"
          (dragleave)="onDragLeave($event, i)"
          (drop)="onDrop($event, i)"
          (dragend)="onDragEnd($event)"
        >
          <app-token-card
            [symbol]="entry.symbol"
            syncGroup="followed"
            [showRemoveButton]="true"
            [draggable]="true"
            (openPosition)="openPositionModal($event)"
            (remove)="onRemove(entry.id)"
            (dragHover)="onDragHover($event, i)"
          />
        </div>
      }
    </div>
  }
</div>
