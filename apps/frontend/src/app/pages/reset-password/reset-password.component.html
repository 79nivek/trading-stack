<app-modal size="SM">
  <ng-container modal-title>
    {{ 'PROFILE.RESET_PASSWORD' | translate }}
  </ng-container>

  <ng-container modal-body>
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <!-- Old Password -->
      <div class="form-group">
        <label for="reset-old-password" class="form-label">{{ 'PROFILE.OLD_PASSWORD' | translate }}</label>
        <input 
          id="reset-old-password" 
          type="password" 
          formControlName="oldPassword" 
          class="form-input" 
          placeholder="{{ 'PROFILE.OLD_PASSWORD_PLACEHOLDER' | translate }}"
        >
        <div *ngIf="form.get('oldPassword')?.invalid && form.get('oldPassword')?.touched" class="form-error">
          <span *ngIf="form.get('oldPassword')?.errors?.['required']">{{ 'ERROR.REQUIRED' | translate }}</span>
        </div>
      </div>

      <!-- New Password -->
      <div class="form-group">
        <label for="reset-new-password" class="form-label">{{ 'PROFILE.NEW_PASSWORD' | translate }}</label>
        <input 
          id="reset-new-password" 
          type="password" 
          formControlName="newPassword" 
          class="form-input" 
          placeholder="{{ 'PROFILE.NEW_PASSWORD_PLACEHOLDER' | translate }}"
        >
        <div *ngIf="form.get('newPassword')?.invalid && form.get('newPassword')?.touched" class="form-error">
          <span *ngIf="form.get('newPassword')?.errors?.['required']">{{ 'ERROR.REQUIRED' | translate }}</span>
          <span *ngIf="form.get('newPassword')?.errors?.['minlength']">{{ 'ERROR.PASSWORD_WEAK' | translate }}</span>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="reset-confirm-password" class="form-label">{{ 'PROFILE.CONFIRM_PASSWORD' | translate }}</label>
        <input 
          id="reset-confirm-password" 
          type="password" 
          formControlName="confirmPassword" 
          class="form-input" 
          placeholder="{{ 'PROFILE.CONFIRM_PASSWORD_PLACEHOLDER' | translate }}"
        >
        <div *ngIf="form.get('confirmPassword')?.touched" class="form-error">
          <span *ngIf="form.get('confirmPassword')?.errors?.['required']">{{ 'ERROR.REQUIRED' | translate }}</span>
          <span *ngIf="form.errors?.['mismatch'] && !form.get('confirmPassword')?.errors?.['required']">{{ 'ERROR.PASSWORD_MISMATCH' | translate }}</span>
        </div>
      </div>
    </form>
  </ng-container>

  <ng-container modal-footer>
    <app-button btnType="primary" (click)="modalService.close()">
      {{ 'COMMON.CANCEL' | translate }}
    </app-button>
    <app-button btnType="success" (click)="submit()" [disabled]="isSubmitting">
      {{ 'COMMON.SUBMIT' | translate }}
    </app-button>
  </ng-container>
</app-modal>
