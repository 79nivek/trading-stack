<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="auth-title">{{ 'AUTH.LOGIN' | translate }}</h1>
      <p class="auth-subtitle">{{ 'LOGIN.WELCOME_BACK' | translate }}</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="login-email" class="form-label">{{
          'AUTH.USERNAME' | translate
        }}</label>
        <input
          id="login-email"
          formControlName="email"
          type="text"
          class="form-input"
          [placeholder]="'AUTH.USERNAME' | translate"
        />
      </div>

      <div class="form-group">
        <label for="login-password" class="form-label">{{
          'AUTH.PASSWORD' | translate
        }}</label>
        <input
          id="login-password"
          formControlName="password"
          type="password"
          class="form-input"
          [placeholder]="'AUTH.PASSWORD' | translate"
        />
      </div>

      <div class="pt-4 text-center">
        <app-button
          type="submit"
          btnType="primary"
          size="L"
          [disabled]="loginForm.invalid || loginMutation.isPending()"
          [isLoading]="loginMutation.isPending()"
          class="w-full block"
        >
          {{ 'AUTH.SUBMIT' | translate }}
        </app-button>
      </div>

      <div class="auth-footer">
        <a [routerLink]="APP_PATHS.SIGN_UP" class="auth-link">{{
          'LOGIN.NO_ACCOUNT' | translate
        }}</a>
      </div>
    </form>
  </div>
</div>
