<div class="profile-container">
  <h1 class="page-title">{{ 'SETTING.PROFILE' | translate }}</h1>
  
  <div class="card">
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6">
      
      <!-- Username -->
      <div class="form-group">
        <label for="profile-username" class="form-label">{{ 'SIGNUP.USERNAME' | translate }}</label>
        <input 
          id="profile-username" 
          type="text" 
          formControlName="username" 
          class="form-input" 
        >
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- First Name -->
        <div class="form-group">
          <label for="profile-firstname" class="form-label">{{ 'SIGNUP.FIRST_NAME' | translate }}</label>
          <input 
            id="profile-firstname" 
            type="text" 
            formControlName="firstName" 
            class="form-input" 
          >
        </div>

        <!-- Last Name -->
        <div class="form-group">
          <label for="profile-lastname" class="form-label">{{ 'SIGNUP.LAST_NAME' | translate }}</label>
          <input 
            id="profile-lastname" 
            type="text" 
            formControlName="lastName" 
            class="form-input" 
          >
        </div>
      </div>

      <!-- Email (Disabled) -->
      <div class="form-group">
        <label for="profile-email" class="form-label">{{ 'SIGNUP.EMAIL' | translate }}</label>
        <input 
          id="profile-email" 
          type="email" 
          formControlName="email" 
          class="form-input opacity-60 cursor-not-allowed" 
        >
      </div>

      <!-- Actions -->
      <div class="flex items-center justify-between pt-4 border-t border-border mt-6">
        <app-button type="button" btnType="primary" (click)="openResetPassword()">
          {{ 'PROFILE.CHANGE_PASSWORD' | translate }}
        </app-button>
        
        <app-button type="submit" btnType="success" [disabled]="form.pristine || form.invalid || isSubmitting">
          {{ 'COMMON.SAVE' | translate }}
        </app-button>
      </div>
    </form>
  </div>
</div>
