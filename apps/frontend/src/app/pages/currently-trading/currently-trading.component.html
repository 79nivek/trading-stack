  <!-- ===== Empty state ===== -->
  <app-no-data [showNoData]="accountServ.currentPositions().size === 0" />
  <!-- ===== Cards grid with drag-and-drop ===== -->
  @if (accountServ.currentPositions().size > 0) {
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
      @for (
        position of accountServ.currentPositions().values();
        track position.symbol
      ) {
        <app-token-card
          [symbol]="position.symbol"
          syncGroup="current-trading"
          [showRemoveButton]="false"
        />
      }
    </div>
  }
