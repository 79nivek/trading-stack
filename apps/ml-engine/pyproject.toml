[project]
name = "ml-engine"
version = "0.1.0"
description = "XGBoost Application for Trading Stack"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "greenlet>=3.1.0",
    "xgboost>=2.1.0",
    "pandas>=2.2.0",
    "pandas-ta>=0.3.14",
    "requests>=2.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "scikit-learn>=1.5.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
